name: Auto Deploy to Linux Server
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy Latest Code
        run: |
          echo "Updating Keys for Cure on Linux..."
          cd ~/keys-for-cure
          git pull origin main
          sudo docker compose up -d --remove-orphans
          echo "Deployment complete! Site updated with 0 downtime."
